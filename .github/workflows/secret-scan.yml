# Secret-Scan der Commits jedes PRs mit Betterleaks (homelab#34). Ausnahmen in
# .betterleaks.toml, ein Fehlalarm einzeln mit Kommentar "betterleaks:allow" in der Zeile.
name: Secret-Scan

on:
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=betterleaks/betterleaks
  BETTERLEAKS_VERSION: v1.9.0

jobs:
  secrets:
    name: Secret-Scan (Betterleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Betterleaks installieren
        working-directory: ${{ runner.temp }}
        run: |
          v=${BETTERLEAKS_VERSION#v}
          url=https://github.com/betterleaks/betterleaks/releases/download/$BETTERLEAKS_VERSION
          curl -fsSLO "$url/betterleaks_${v}_linux_x64.tar.gz" -fsSLO "$url/checksums.txt"
          grep " betterleaks_${v}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c
          tar xzf "betterleaks_${v}_linux_x64.tar.gz" betterleaks
          sudo install betterleaks /usr/local/bin/

      # Nur die neuen Commits, die Historie bis 29.10.2026 wurde einmal komplett geprüft
      - name: Commits prüfen
        env:
          BEREICH: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: betterleaks git --no-banner --redact --verbose --log-opts="$BEREICH" .
